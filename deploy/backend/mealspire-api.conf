# Fragment vhostu TLS `sochiera.pl` / `www.sochiera.pl`: Mealspire backend /v1.
# Usługa mealspire-backend nasłuchuje tylko na 127.0.0.1:8794.
# Adres w aplikacji: https://sochiera.pl/mealspire-api
# Bez logowania (Authorization/body nie trafiają do logów).

location /mealspire-api/ {
    limit_req zone=mealspire_api burst=20 nodelay;
    limit_conn mealspire_conn 4;
    limit_req_status 429;
    limit_conn_status 429;
    client_max_body_size 256k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8794/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 240s;
    proxy_send_timeout 30s;
    access_log off;
}
