# Template for a SEPARATE proxy instance; never include into homepage configuration.
# TLS certificate must have IP SAN 51.83.199.206 and be trusted by Android.
worker_processes 1;
pid /run/mealspire-proxy.pid;
error_log /var/log/mealspire-proxy/error.log warn;
events { worker_connections 256; }
http {
    access_log off; # never log credentials, input, history or model output
    client_max_body_size 64k;
    client_body_timeout 15s;
    limit_req_zone $binary_remote_addr zone=mealspire:1m rate=10r/m;
    server {
        listen 8443 ssl;
        server_name 51.83.199.206;
        ssl_certificate /etc/mealspire/tls/fullchain.pem;
        ssl_certificate_key /etc/mealspire/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            limit_req zone=mealspire burst=5 nodelay;
            proxy_pass http://127.0.0.1:18081;
            proxy_read_timeout 200s;
            proxy_connect_timeout 5s;
        }
    }
}
